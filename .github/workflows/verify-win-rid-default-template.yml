name: Verify Windows RID default (template)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates/maui/**'
jobs:
  windows-rid-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload (full, includes Windows/WinUI support)
        run: dotnet workload install maui --skip-manifest-update
      - name: Pack template from local source
        run: >
          dotnet pack templates/maui/Fabulous.MauiControls.Templates.proj
          -p:Version=0.0.0-local
          -c Release
          -o ./nupkg-local
      - name: Install template from local package
        shell: bash
        run: |
          NUPKG=$(ls ./nupkg-local/*.nupkg | grep -i "MauiControls.Templates")
          echo "Installing $NUPKG"
          dotnet new install "$NUPKG" --force

      # --- Fix #1: use pwsh + Join-Path so the output path has clean,
      # single-style Windows separators (no more D:\a\_temp/rid-check mixing) ---
      - name: Scaffold test project
        id: scaffold
        shell: pwsh
        run: |
          $OUT_DIR = Join-Path $env:RUNNER_TEMP "rid-check"
          dotnet new fabulous-mauicontrols -n RidCheck -o $OUT_DIR
          $FSPROJ = Join-Path $OUT_DIR "RidCheck.fsproj"
          "out_dir=$OUT_DIR" >> $env:GITHUB_OUTPUT
          "fsproj=$FSPROJ" >> $env:GITHUB_OUTPUT

      - name: Sanity check - RuntimeIdentifier/Platform defaults are wired for Windows TFM
        shell: pwsh
        run: |
          $FSPROJ = "${{ steps.scaffold.outputs.fsproj }}"
          Write-Host "--- Windows-conditioned properties ---"
          $match = Select-String -Path $FSPROJ -Pattern "TargetPlatformIdentifier.*windows" -Context 0,5
          if (-not $match) {
            Write-Host "::error::No Windows-conditioned PropertyGroup found in generated fsproj."
            exit 1
          }
          $match | ForEach-Object { $_.Line; $_.Context.PostContext }

      # --- Case 1: no RID passed at all — must succeed via the template default ---
      - name: Build Windows target (no RID override)
        run: >
          dotnet build "${{ steps.scaffold.outputs.fsproj }}"
          -c Release
          -f net10.0-windows10.0.19041.0
          -v:diag
          -bl:${{ runner.temp }}/build-no-rid.binlog

      - name: Upload build binlog on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-no-rid-binlog
          path: ${{ runner.temp }}/build-no-rid.binlog

      - name: Publish Windows target (no RID override)
        run: >
          dotnet publish "${{ steps.scaffold.outputs.fsproj }}"
          -c Release
          -f net10.0-windows10.0.19041.0

      - name: Verify default RID landed in publish output path
        shell: pwsh
        run: |
          $OUT = Join-Path "${{ steps.scaffold.outputs.out_dir }}" "bin\Release\net10.0-windows10.0.19041.0\win-x64"
          if (-not (Test-Path $OUT)) {
            Write-Host "::error::Expected default win-x64 output directory not found: $OUT"
            exit 1
          }

      # --- Case 2: singular RID override must win over the default ---
      - name: Publish Windows target (-p:RuntimeIdentifier=win-arm64)
        run: >
          dotnet publish "${{ steps.scaffold.outputs.fsproj }}"
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:RuntimeIdentifier=win-arm64

      - name: Verify singular override landed in publish output path
        shell: pwsh
        run: |
          $OUT = Join-Path "${{ steps.scaffold.outputs.out_dir }}" "bin\Release\net10.0-windows10.0.19041.0\win-arm64"
          if (-not (Test-Path $OUT)) {
            Write-Host "::error::Expected win-arm64 output directory not found after singular override: $OUT"
            exit 1
          }

      # --- Case 3: plural RuntimeIdentifiers override must not be clobbered by the default ---
      - name: Publish Windows target (-p:RuntimeIdentifiers=win-x64;win-arm64)
        run: >
          dotnet publish "${{ steps.scaffold.outputs.fsproj }}"
          -c Release
          -f net10.0-windows10.0.19041.0
          -p:RuntimeIdentifiers=win-x64%3Bwin-arm64
          -p:RuntimeIdentifier=win-arm64

      - name: Cleanup local template install
        if: always()
        run: dotnet new uninstall Fabulous.MauiControls.Templates || true

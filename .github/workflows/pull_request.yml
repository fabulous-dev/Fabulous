name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CONFIG: Release

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Validate monorepo migration inventory
        run: python3 eng/monorepo/validate-inventory.py
      - name: Check core code formatting
        run: |
          dotnet tool restore
          dotnet fantomas --check src/neutral/Fabulous.Core
          dotnet fantomas --check src/neutral/Fabulous.Tests
          dotnet fantomas --check src/neutral/Fabulous.Benchmarks

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Test
        run: dotnet test Fabulous.sln -c ${CONFIG}
      - name: Prepare templates
        run: python3 eng/monorepo/prepare-templates.py 0.0.0-ci.${GITHUB_RUN_ID}
      - name: Pack
        run: dotnet pack Fabulous.sln -c ${CONFIG} -p:Version=0.0.0-ci.${GITHUB_RUN_ID} --no-restore --property PackageOutputPath=${PWD}/nupkgs
      - name: Validate package count
        run: test "$(find nupkgs -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)" -eq 13
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: nupkgs/

  avalonia-samples:
    name: Avalonia sample tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Test view logic
        run: dotnet test samples/avalonia/TestableApp.UnitTests/TestableApp.UnitTests.fsproj -c ${CONFIG} -p:FabulousSamplesDesktopOnly=true
      - name: Test headless UI
        run: dotnet test samples/avalonia/TestableApp.Headless.XUnit/TestableApp.Headless.XUnit.fsproj -c ${CONFIG} -p:FabulousSamplesDesktopOnly=true
        env:
          FABULOUS_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots-Avalonia
          path: artifacts/screenshots/*.png
          if-no-files-found: error

  avalonia-template:
    name: Avalonia template smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: nupkgs
      - name: Instantiate template
        run: |
          dotnet new install nupkgs/Fabulous.Avalonia.Templates.*.nupkg
          dotnet new fabulous-avalonia-desktop -n AvaloniaTemplateApp -o "${RUNNER_TEMP}/avalonia-template"
      - name: Build generated app
        run: |
          dotnet restore "${RUNNER_TEMP}/avalonia-template/AvaloniaTemplateApp.fsproj" --source "${PWD}/nupkgs" --source https://api.nuget.org/v3/index.json
          dotnet build "${RUNNER_TEMP}/avalonia-template/AvaloniaTemplateApp.fsproj" -c ${CONFIG} --no-restore

  windows-compat:
    name: Windows compatibility
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Select preinstalled .NET 9 SDK
        run: |
          $sdkVersion = dotnet --list-sdks |
            ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -like '9.0.*' } |
            Select-Object -Last 1
          if (-not $sdkVersion) {
            throw 'No .NET 9 SDK is installed on the runner.'
          }
          @{
            sdk = @{
              version = $sdkVersion
              rollForward = 'latestPatch'
            }
          } | ConvertTo-Json | Set-Content global.json
          dotnet --version
          dotnet workload list
      - name: Install missing Tizen workload
        run: dotnet workload install maui-tizen --skip-manifest-update
      - name: Build compatibility package
        run: dotnet build src/maui/FSharp.Maui.WinUICompat/FSharp.Maui.WinUICompat.csproj -c $env:CONFIG
      - name: Build TicTacToe sample
        run: dotnet build samples/maui/TicTacToe/TicTacToe.fsproj -c $env:CONFIG -p:FabulousWindowsOnly=true
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: nupkgs
      - name: Instantiate MAUI template
        run: |
          dotnet new install (Get-ChildItem nupkgs/Fabulous.MauiControls.Templates.*.nupkg).FullName
          dotnet new fabulous-mauicontrols -n MauiTemplateApp -o "$env:RUNNER_TEMP/maui-template"
      - name: Build generated MAUI app
        run: |
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="ci-packages" value="${{ github.workspace }}\nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          "@ | Set-Content "$env:RUNNER_TEMP/NuGet.Config"
          dotnet restore "$env:RUNNER_TEMP/maui-template/MauiTemplateApp.fsproj" -p:FabulousWindowsOnly=true --configfile "$env:RUNNER_TEMP/NuGet.Config"
          dotnet build "$env:RUNNER_TEMP/maui-template/MauiTemplateApp.fsproj" -c $env:CONFIG -p:FabulousWindowsOnly=true --no-restore
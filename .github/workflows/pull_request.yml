name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONFIG: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Validate monorepo migration inventory
        run: python3 eng/monorepo/validate-inventory.py
      - name: Check core code formatting
        run: |
          dotnet tool restore
          dotnet fantomas --check src/neutral/Fabulous.Core
          dotnet fantomas --check src/neutral/Fabulous.Tests
          dotnet fantomas --check src/neutral/Fabulous.Benchmarks

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Install MAUI workload packs
        run: dotnet workload install maui-tizen --skip-manifest-update
      - name: Test
        run: dotnet test Fabulous.sln -c ${CONFIG}
      - name: Prepare templates
        run: python3 eng/monorepo/prepare-templates.py 0.0.0-ci.${GITHUB_RUN_ID}
      - name: Pack
        run: dotnet pack Fabulous.sln -c ${CONFIG} -p:Version=0.0.0-ci.${GITHUB_RUN_ID} --no-restore --property PackageOutputPath=${PWD}/nupkgs
      - name: Validate package count
        run: test "$(find nupkgs -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)" -eq 13
      - name: Validate package contents
        run: python3 eng/monorepo/validate-packages.py nupkgs
      - name: Validate SourceLink mappings
        run: |
          dotnet tool install --global sourcelink
          while IFS= read -r -d '' package; do
            package_dir="${RUNNER_TEMP}/sourcelink/$(basename "$package" .snupkg)"
            mkdir -p "$package_dir"
            unzip -q "$package" -d "$package_dir"
            while IFS= read -r -d '' pdb; do
              mappings="$(sourcelink print-urls "$pdb")"
              test -n "$mappings"
              grep -Fq 'https://raw.githubusercontent.com/fabulous-dev/Fabulous/' <<< "$mappings"
            done < <(find "$package_dir" -name '*.pdb' -print0)
          done < <(find nupkgs -maxdepth 1 -name '*.snupkg' -print0)
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: nupkgs/

  avalonia-samples:
    name: Avalonia sample runtime tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Test view logic
        run: dotnet test samples/avalonia/TestableApp.UnitTests/TestableApp.UnitTests.fsproj -c ${CONFIG} -p:FabulousSamplesDesktopOnly=true
      - name: Test headless UI
        run: dotnet run --project samples/avalonia/TestableApp.Headless.XUnit/TestableApp.Headless.XUnit.fsproj -c ${CONFIG} -p:FabulousSamplesDesktopOnly=true
        env:
          FABULOUS_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots/avalonia-headless
      - name: Upload headless screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-Headless-Screenshots
          path: artifacts/screenshots/avalonia-headless/
          if-no-files-found: error

  avalonia-capture:
    name: Avalonia capture shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Install desktop capture tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick xdotool xvfb
      - name: Build, run, and capture sample shard
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' bash eng/ci/capture-avalonia-samples.sh ${{ matrix.shard }} 4
        env:
          CONFIG: Debug
      - name: Upload shard screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-Screenshots-${{ matrix.shard }}
          path: artifacts/screenshots/avalonia/
          if-no-files-found: error

  avalonia-screenshots:
    name: Aggregate Avalonia screenshots
    needs: [avalonia-samples, avalonia-capture]
    runs-on: ubuntu-latest
    steps:
      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: Avalonia-*Screenshots*
          path: artifacts/screenshots/
          merge-multiple: true
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots-Avalonia
          path: artifacts/screenshots/**/*.png
          if-no-files-found: error

  maui-android-package:
    name: MAUI Android package shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Build Android sample shard
        run: bash eng/ci/capture-maui-android-samples.sh build ${{ matrix.shard }} 4
        env:
          CONFIG: Debug
      - name: Upload signed Android packages
        uses: actions/upload-artifact@v4
        with:
          name: MAUI-Android-Packages-${{ matrix.shard }}
          path: artifacts/android-packages/
          if-no-files-found: error

  maui-android-samples:
    name: MAUI Android sample runtime tests
    needs: maui-android-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Download signed Android packages
        uses: actions/download-artifact@v4
        with:
          pattern: MAUI-Android-Packages-*
          path: artifacts/android-packages/
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run and capture every Android sample
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash eng/ci/capture-maui-android-samples.sh capture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots-MAUI-Android
          path: artifacts/screenshots/maui-android/
          if-no-files-found: error

  avalonia-template:
    name: Avalonia template (${{ matrix.template }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: blank
            short-name: fabulous-avalonia
            project: AvaloniaTemplateApp.fsproj
          - template: desktop
            short-name: fabulous-avalonia-desktop
            project: AvaloniaTemplateApp.fsproj
          - template: multi-project
            short-name: fabulous-avalonia-multi
            project: AvaloniaTemplateApp.Desktop/AvaloniaTemplateApp.Desktop.fsproj
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: nupkgs
      - name: Instantiate template
        run: |
          dotnet new install nupkgs/Fabulous.Avalonia.Templates.*.nupkg
          dotnet new ${{ matrix.short-name }} -n AvaloniaTemplateApp -o "${RUNNER_TEMP}/avalonia-template"
      - name: Build generated app
        run: |
          project="${RUNNER_TEMP}/avalonia-template/${{ matrix.project }}"
          build_args=()
          if [[ "${{ matrix.template }}" == "blank" ]]; then
            build_args=(-p:TargetFrameworks=net10.0)
          fi
          dotnet restore "$project" "${build_args[@]}" --source "${PWD}/nupkgs" --source https://api.nuget.org/v3/index.json
          dotnet build "$project" -c ${CONFIG} "${build_args[@]}" --no-restore

  android-runtime:
    name: Android build and launch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Select installed .NET 10 SDK
        run: |
          sdk_version=$(dotnet --list-sdks | awk '/^10\.0\./ { version=$1 } END { print version }')
          test -n "$sdk_version"
          dotnet new globaljson --sdk-version "$sdk_version" --roll-forward latestPatch --force
      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Build Android sample
        run: dotnet build samples/maui/HelloWorld/HelloWorld.fsproj -t:SignAndroidPackage -c ${CONFIG} -f net10.0-android -p:FabulousAndroidOnly=true -p:RuntimeIdentifier=android-x64 -p:AndroidPackageFormat=apk -p:AndroidPackageFormats=apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and assert Android process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash eng/ci/capture-maui-android-samples.sh smoke org.fabulous.maui.helloworld "$(find samples/maui/HelloWorld -name '*-Signed.apk' -print -quit)"

  apple-runtime:
    name: Apple build and launch
    runs-on: macos-26
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Select installed .NET 10 SDK
        run: |
          sdk_version=$(dotnet --list-sdks | awk '/^10\.0\./ { version=$1 } END { print version }')
          test -n "$sdk_version"
          dotnet new globaljson --sdk-version "$sdk_version" --roll-forward latestPatch --force
      - name: Install Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update
      - name: Build iOS sample
        run: dotnet build samples/maui/HelloWorld/HelloWorld.fsproj -c ${CONFIG} -f net10.0-ios -p:FabulousIosOnly=true -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false
      - name: Build Mac Catalyst sample
        run: dotnet build samples/maui/HelloWorld/HelloWorld.fsproj -c ${CONFIG} -f net10.0-maccatalyst -p:FabulousMacCatalystOnly=true -p:RuntimeIdentifier=maccatalyst-arm64 -p:ValidateXcodeVersion=false
      - name: Launch and assert Mac Catalyst process
        shell: bash
        run: |
          app=$(find samples/maui/HelloWorld/bin/${CONFIG}/net10.0-maccatalyst -name '*.app' -print -quit)
          test -n "$app"
          open "$app"
          for attempt in {1..10}; do
            if pgrep -f "$app/Contents/MacOS"; then
              pkill -f "$app/Contents/MacOS"
              exit 0
            fi
            sleep 2
          done
          exit 1

  windows-compat:
    name: Windows compatibility
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Select .NET 10 SDK
        run: |
          $sdkVersion = dotnet --list-sdks |
            ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -like '10.0.*' } |
            Select-Object -Last 1
          if (-not $sdkVersion) {
            throw 'No .NET 10 SDK is installed on the runner.'
          }
          @{
            sdk = @{
              version = $sdkVersion
              rollForward = 'latestPatch'
            }
          } | ConvertTo-Json | Set-Content global.json
          dotnet --version
          dotnet workload list
      - name: Install missing Tizen workload
        run: dotnet workload install maui-tizen --skip-manifest-update
      - name: Build compatibility package
        run: dotnet build src/maui/FSharp.Maui.WinUICompat/FSharp.Maui.WinUICompat.csproj -c $env:CONFIG -p:RuntimeIdentifier=win-x64 -p:Platform=x64
      - name: Build and launch unpackaged F# WinUI compatibility samples
        run: |
          $samples = @(
            @{ Project = 'samples/maui/WinUICompat/HelloWorld.Maui/HelloWorld.Maui.fsproj'; Name = 'plain MAUI' },
            @{ Project = 'samples/maui/WinUICompat/HelloWorld.Fabulous/HelloWorld.Fabulous.fsproj'; Name = 'Fabulous' }
          )
          foreach ($sample in $samples) {
            dotnet build $sample.Project -c $env:CONFIG -p:RuntimeIdentifier=win-x64 -p:Platform=x64 -p:WindowsPackageType=None
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to build the $($sample.Name) WinUI compatibility sample."
            }
            $projectDirectory = Split-Path $sample.Project
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($sample.Project)
            $executable = Get-ChildItem "$projectDirectory/bin/$env:CONFIG" -Recurse -Filter "$projectName.exe" | Select-Object -First 1
            if (-not $executable) {
              throw "The $($sample.Name) WinUI compatibility executable was not produced."
            }
            $process = Start-Process $executable.FullName -PassThru
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "The $($sample.Name) WinUI compatibility sample exited during startup with code $($process.ExitCode)."
            }
            Stop-Process -Id $process.Id
          }
      - name: Build TicTacToe sample
        run: dotnet build samples/maui/TicTacToe/TicTacToe.fsproj -c $env:CONFIG -f net10.0-windows10.0.19041.0 -p:FabulousWindowsOnly=true -p:RuntimeIdentifier=win-x64 -p:Platform=x64 -p:WindowsPackageType=None
      - name: Launch and assert Windows sample process
        run: |
          $executable = Get-ChildItem samples/maui/TicTacToe/bin -Recurse -Filter TicTacToe.exe | Select-Object -First 1
          if (-not $executable) {
            throw 'TicTacToe executable was not produced.'
          }
          $process = Start-Process $executable.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "TicTacToe exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id
      - name: Build Windows-only samples
        run: |
          dotnet build samples/maui/WinUICompat/HelloWorld.Fabulous/HelloWorld.Fabulous.fsproj -c $env:CONFIG
          dotnet build samples/maui/WinUICompat/HelloWorld.Maui/HelloWorld.Maui.fsproj -c $env:CONFIG
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: nupkgs
      - name: Instantiate MAUI template
        run: |
          dotnet new install (Get-ChildItem nupkgs/Fabulous.MauiControls.Templates.*.nupkg).FullName
          dotnet new fabulous-mauicontrols -n MauiTemplateApp -o "$env:RUNNER_TEMP/maui-template"
      - name: Build generated MAUI app
        run: |
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="ci-packages" value="${{ github.workspace }}\nupkgs" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          "@ | Set-Content "$env:RUNNER_TEMP/NuGet.Config"
          dotnet restore "$env:RUNNER_TEMP/maui-template/MauiTemplateApp.fsproj" -p:FabulousWindowsOnly=true --configfile "$env:RUNNER_TEMP/NuGet.Config"
          dotnet build "$env:RUNNER_TEMP/maui-template/MauiTemplateApp.fsproj" -c $env:CONFIG -p:FabulousWindowsOnly=true --no-restore
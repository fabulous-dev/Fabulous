name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CONFIG: Release

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Validate monorepo migration inventory
        run: python3 eng/monorepo/validate-inventory.py
      - name: Check core code formatting
        run: |
          dotnet tool restore
          dotnet fantomas --check src/Fabulous
          dotnet fantomas --check src/Fabulous.Tests
          dotnet fantomas --check src/Fabulous.Benchmarks

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Test
        run: dotnet test Fabulous.NoSamples.sln -c ${CONFIG}

  windows-compat:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build
        run: dotnet build src/FSharp.Maui.WinUICompat/FSharp.Maui.WinUICompat.csproj -c $env:CONFIG
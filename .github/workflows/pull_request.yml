name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CONFIG: Release

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Validate monorepo migration inventory
        run: python3 eng/monorepo/validate-inventory.py
      - name: Check core code formatting
        run: |
          dotnet tool restore
          dotnet fantomas --check src/neutral/Fabulous.Core
          dotnet fantomas --check src/neutral/Fabulous.Tests
          dotnet fantomas --check src/neutral/Fabulous.Benchmarks

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Test
        run: dotnet test Fabulous.sln -c ${CONFIG}

  pack:
    name: Pack
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Prepare templates
        run: python3 eng/monorepo/prepare-templates.py 0.0.0-ci.${GITHUB_RUN_ID}
      - name: Pack
        run: dotnet pack Fabulous.sln -c ${CONFIG} -p:Version=0.0.0-ci.${GITHUB_RUN_ID} --property PackageOutputPath=${PWD}/nupkgs
      - name: Validate package count
        run: test "$(find nupkgs -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)" -eq 13
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: nupkgs/

  avalonia-samples:
    name: Avalonia sample tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Test view logic
        run: dotnet test samples/avalonia/TestableApp.UnitTests/TestableApp.UnitTests.fsproj -c ${CONFIG} -p:FabulousSamplesDesktopOnly=true
      - name: Test headless UI
        run: dotnet test samples/avalonia/TestableApp.Headless.XUnit/TestableApp.Headless.XUnit.fsproj -c ${CONFIG} -p:FabulousSamplesDesktopOnly=true

  avalonia-template:
    name: Avalonia template smoke test
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: nupkgs
      - name: Instantiate template
        run: |
          dotnet new install nupkgs/Fabulous.Avalonia.Templates.*.nupkg
          dotnet new fabulous-avalonia-desktop -n AvaloniaTemplateApp -o "${RUNNER_TEMP}/avalonia-template"
      - name: Build generated app
        run: |
          dotnet restore "${RUNNER_TEMP}/avalonia-template/AvaloniaTemplateApp.fsproj" --source "${PWD}/nupkgs" --source https://api.nuget.org/v3/index.json
          dotnet build "${RUNNER_TEMP}/avalonia-template/AvaloniaTemplateApp.fsproj" -c ${CONFIG} --no-restore

  windows-compat:
    name: Windows compatibility
    needs: pack
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build compatibility package
        run: dotnet build src/maui/FSharp.Maui.WinUICompat/FSharp.Maui.WinUICompat.csproj -c $env:CONFIG
      - name: Build TicTacToe sample
        run: dotnet build samples/maui/TicTacToe/TicTacToe.fsproj -c $env:CONFIG -p:TargetFrameworks=net8.0-windows10.0.19041.0
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: Packages
          path: nupkgs
      - name: Instantiate MAUI template
        run: |
          dotnet new install (Get-ChildItem nupkgs/Fabulous.MauiControls.Templates.*.nupkg).FullName
          dotnet new fabulous-mauicontrols -n MauiTemplateApp -o "$env:RUNNER_TEMP/maui-template"
      - name: Build generated MAUI app
        run: |
          dotnet restore "$env:RUNNER_TEMP/maui-template/MauiTemplateApp.fsproj" -p:TargetFrameworks=net8.0-windows10.0.19041.0 --source "$PWD/nupkgs" --source https://api.nuget.org/v3/index.json
          dotnet build "$env:RUNNER_TEMP/maui-template/MauiTemplateApp.fsproj" -c $env:CONFIG -p:TargetFrameworks=net8.0-windows10.0.19041.0 --no-restore
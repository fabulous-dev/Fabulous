name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CONFIG: Release

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Validate monorepo migration inventory
        run: python3 eng/monorepo/validate-inventory.py
      - name: Check core code formatting
        run: |
          dotnet tool restore
          dotnet fantomas --check src

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Test
        run: dotnet test src/Fabulous.Tests/Fabulous.Tests.fsproj -c ${CONFIG}

  avalonia:
    name: Avalonia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x
      - name: Build packages
        run: dotnet build platforms/avalonia/Fabulous.Avalonia.NoSamples.sln -c ${CONFIG}
      - name: Test
        run: dotnet test platforms/avalonia/src/Fabulous.Avalonia.Tests/Fabulous.Avalonia.Tests.fsproj -c ${CONFIG}

  maui:
    name: Maui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Test
        run: dotnet test platforms/maui/src/Fabulous.MauiControls.Tests/Fabulous.MauiControls.Tests.fsproj -c ${CONFIG}
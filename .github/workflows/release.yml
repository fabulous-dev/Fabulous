name: Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      version:
        description: Existing changelog version to retry
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

env:
  CONFIG: Release
  SLN_FILE: Fabulous.sln
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect new release section
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(python3 eng/monorepo/changelog.py current-version CHANGELOG.md)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Requested version $REQUESTED_VERSION does not match current changelog version $CURRENT_VERSION" >&2
              exit 1
            fi
            python3 eng/monorepo/changelog.py validate-version CHANGELOG.md "$CURRENT_VERSION"
            python3 eng/monorepo/changelog.py notes CHANGELOG.md "$CURRENT_VERSION" > "$RUNNER_TEMP/release-notes.md"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show HEAD^:CHANGELOG.md > "$RUNNER_TEMP/previous-changelog.md"
          PREVIOUS_VERSION=$(python3 eng/monorepo/changelog.py current-version "$RUNNER_TEMP/previous-changelog.md")
          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 eng/monorepo/changelog.py validate-version CHANGELOG.md "$CURRENT_VERSION"
          python3 eng/monorepo/changelog.py notes CHANGELOG.md "$CURRENT_VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching Build and test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pull_request.yml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
              exit 0
            fi
            sleep 10
          done
          echo "Build and test run not found for $GITHUB_SHA" >&2
          exit 1
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Write release notes
        run: python3 eng/monorepo/changelog.py notes CHANGELOG.md "${{ needs.detect.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/*.fsproj', '**/*.csproj', '**/*.proj', '**/*.props', '**/*.targets', '**/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ github.job }}-
            nuget-${{ runner.os }}-
      - name: Install MAUI workload packs
        run: dotnet workload install maui-tizen --skip-manifest-update
      - name: Restore
        run: dotnet restore ${SLN_FILE}
      - name: Build and test
        run: dotnet test ${SLN_FILE} -p:Version=${{ needs.detect.outputs.version }} -c ${CONFIG} --no-restore
      - name: Prepare templates
        run: python3 eng/monorepo/prepare-templates.py ${{ needs.detect.outputs.version }}
      - name: Pack
        run: dotnet pack ${SLN_FILE} -p:Version=${{ needs.detect.outputs.version }} -p:PackageReleaseNotesFile="$RUNNER_TEMP/release-notes.md" -c ${CONFIG} --no-restore --property PackageOutputPath=${PWD}/nupkgs
      - name: Validate package count
        run: test "$(find nupkgs -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)" -eq 13
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: nupkgs/
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dsyme
      - name: Push packages
        run: dotnet nuget push "nupkgs/*" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.detect.outputs.version }}" --target "$GITHUB_SHA" --title "${{ needs.detect.outputs.version }}" --notes-file "$RUNNER_TEMP/release-notes.md"

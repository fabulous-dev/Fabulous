name: Verify Avalonia template output
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates/avalonia/**'
  push:
    branches: [main]
    paths:
      - 'templates/avalonia/**'

jobs:
  scaffold-and-check:
    # Avalonia's android/ios workloads aren't MAUI-specific, so this doesn't need
    # windows-latest for the same reason the MAUI job does. Kept for now to match
    # the existing job; reconsider ubuntu-latest once this is proven to work.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Only "android" is installed because the restore-check step below only
      # targets net10.0-android (matching the MAUI workflow's scope). There is
      # no "avalonia-*" workload id — Avalonia uses the plain SDK workloads.
      - name: Install Android workload pack
        run: dotnet workload install android --skip-manifest-update

      - name: Determine current published Fabulous version
        id: fabulous_version
        shell: bash
        run: |
          VERSION=$(curl -s https://api.nuget.org/v3-flatcontainer/fabulous/index.json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['versions'][-1])")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a published Fabulous version from NuGet."
            exit 1
          fi
          echo "Using Fabulous version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # NOTE: prepare-templates.py stamps this same version into BOTH
          # FabulousPkgVersion and FabulousAvaloniaPkgVersion. This assumes
          # Fabulous and Fabulous.Avalonia are always published in lockstep.
          # If that's not guaranteed, this step needs a second NuGet query
          # for the fabulous.avalonia package and prepare-templates.py needs
          # to accept per-package versions.

      - name: Prepare templates (replace PKG_VERSION placeholders)
        run: python3 eng/monorepo/prepare-templates.py ${{ steps.fabulous_version.outputs.version }}

      - name: Restore templates project
        run: dotnet restore templates/avalonia/Fabulous.Avalonia.Templates.proj

      - name: Pack template
        run: >
          dotnet pack templates/avalonia/Fabulous.Avalonia.Templates.proj
          -p:Version=${{ steps.fabulous_version.outputs.version }}
          -c Release
          --no-restore
          -o ./nupkg-local

      - name: Install template from local package (not source folder, not NuGet)
        shell: bash
        run: |
          NUPKG=$(ls ./nupkg-local/*.nupkg | grep -i "Avalonia.Templates")
          echo "Installing $NUPKG"
          dotnet new install "$NUPKG" --force

      - name: Scaffold a test project (outside the repo checkout, to avoid CPM leakage)
        id: scaffold
        shell: bash
        run: |
          OUT_DIR="${RUNNER_TEMP}/smoke-test"
          echo "Scaffolding into: $OUT_DIR"
          dotnet new fabulous-avalonia -n SmokeTest -o "$OUT_DIR"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      # Avalonia packages are explicit PackageReferences whose Version attribute
      # is the literal symbol name (e.g. Version="AvaloniaAndroidPkgVersion")
      # until dotnet new substitutes it. So the meaningful failure here is a
      # leftover, unsubstituted symbol name or literal "PKG_VERSION" text in a
      # Version attribute — not a stale-major-version check like MAUI's, since
      # there's no implicit/workload-provided package in this template.
      - name: Check generated .fsproj for unsubstituted template placeholders
        id: version_check
        shell: bash
        run: |
          FSPROJ="${{ steps.scaffold.outputs.out_dir }}/SmokeTest.fsproj"
          echo "--- Generated PackageReferences ---"
          grep "PackageReference" "$FSPROJ"

          if grep -qE 'Version="(PKG_VERSION|FabulousPkgVersion|FabulousAvaloniaPkgVersion|AvaloniaAndroidPkgVersion|AvaloniaDesktopPkgVersion|AvaloniaiOSPkgVersion|AvaloniaThemesFluentPkgVersion|FSharpCorePkgVersion)"' "$FSPROJ"; then
            echo "::error::Generated project still contains an unsubstituted template placeholder in a Version attribute. Symbol replacement did not run correctly."
            exit 1
          fi
          echo "Version check passed: no unsubstituted placeholders found."

      - name: Restore (net10.0-android only, fails loudly on NU1605-class downgrades)
        id: restore_check
        run: >
          dotnet build "${{ steps.scaffold.outputs.out_dir }}/SmokeTest.fsproj"
          -t:Restore
          -f net10.0-android
          /warnaserror:NU1605
          -v:normal
          /bl:${{ runner.temp }}/restore.binlog

      - name: Upload restore binlog on failure
        if: failure() && steps.restore_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: restore-binlog
          path: ${{ runner.temp }}/restore.binlog

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Verify Avalonia template output" >> $GITHUB_STEP_SUMMARY
          echo "- Fabulous version used: ${{ steps.fabulous_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Scaffold dir: ${{ steps.scaffold.outputs.out_dir }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version check: ${{ steps.version_check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Restore check: ${{ steps.restore_check.outcome }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup local template install
        if: always()
        run: dotnet new uninstall Fabulous.Avalonia.Templates || true

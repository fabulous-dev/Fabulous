name: Verify MAUI template output
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates/maui/**'
  push:
    branches: [main]
    paths:
      - 'templates/maui/**'

jobs:
  scaffold-and-check:
    runs-on: windows-latest   # MAUI workloads are easiest on windows-latest runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Locate template package project
        id: locate
        shell: bash
        run: |
          echo "--- Searching for packable project files under templates ---"
          find templates -maxdepth 3 \( -iname "*.fsproj" -o -iname "*.csproj" \) | tee found.txt

          PROJ=$(grep -i "templates" found.txt | head -n1)
          if [ -z "$PROJ" ]; then
            PROJ=$(head -n1 found.txt)
          fi

          if [ -z "$PROJ" ]; then
            echo "::error::No .fsproj/.csproj found under templates/ - cannot pack."
            exit 1
          fi

          echo "Using project: $PROJ"
          echo "proj=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Pack template
        run: dotnet pack "${{ steps.locate.outputs.proj }}" -c Release -o ./nupkg-local

      - name: Install template from local package (not source folder, not NuGet)
        shell: bash
        run: |
          NUPKG=$(ls ./nupkg-local/*.nupkg)
          echo "Installing $NUPKG"
          dotnet new install "$NUPKG" --force

      - name: Scaffold a test project
        run: dotnet new fabulous-mauicontrols -n SmokeTest -o smoke-test

      - name: Check generated .fsproj doesn't pin a stale MAUI version
        id: version_check
        shell: bash
        run: |
          FSPROJ="smoke-test/SmokeTest.fsproj"
          echo "--- Generated PackageReferences ---"
          grep "PackageReference" "$FSPROJ"

          if grep -q 'Microsoft.Maui.Controls" Version="8\.' "$FSPROJ"; then
            echo "::error::Generated project still pins a pre-10.0 Microsoft.Maui.Controls version. Template default is not wired correctly."
            exit 1
          fi
          echo "Version check passed: no stale 8.x MAUI pin found."

      - name: Restore (net10.0-android only, fails loudly on NU1605-class downgrades)
        id: restore_check
        run: >
          dotnet build smoke-test/SmokeTest.fsproj
          -t:Restore
          -f net10.0-android
          /warnaserror:NU1605
          -v:normal
          /bl:restore.binlog

      - name: Upload restore binlog on failure
        if: failure() && steps.restore_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: restore-binlog
          path: restore.binlog

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Verify MAUI template output" >> $GITHUB_STEP_SUMMARY
          echo "- Located project: ${{ steps.locate.outputs.proj }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version check: ${{ steps.version_check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Restore check: ${{ steps.restore_check.outcome }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup local template install
        if: always()
        run: dotnet new uninstall Fabulous.MauiControls.Templates || true

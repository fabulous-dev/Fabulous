name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - website/**
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - website/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.127.0
          extended: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate documentation links
        run: python3 -B eng/monorepo/validate-doc-links.py
      - name: Validate generated API reference
        run: python3 -B eng/monorepo/generate-api-reference.py --check
      - name: Build
        run: hugo --source website --destination "$GITHUB_WORKSPACE/public" --minify --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Build authored documentation
        run: |
          python -m pip install mkdocs==1.6.1
          mkdocs build --config-file docs/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/public/docs"
      - name: Build API reference
        run: mkdocs build --config-file docs/api/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/public/docs/api"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy website
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
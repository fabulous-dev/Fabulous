name: Comment PR artifacts

on:
  workflow_run:
    workflows:
      - Build and test
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            let pullRequests = run.pull_requests ?? [];

            if (pullRequests.length === 0) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pullRequests = associated.data;
            }

            if (pullRequests.length === 0) {
              core.info(`No pull request found for ${run.head_sha}`);
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 }
            );
            const published = artifacts.filter(
              artifact => !artifact.expired &&
                ['Packages', 'Screenshots-Avalonia', 'Screenshots-MAUI-Android'].includes(artifact.name)
            );
            const artifactLines = published.map(
              artifact => `- [${artifact.name}](${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id})`
            );
            const marker = '<!-- fabulous-ci-artifacts -->';
            const body = [
              marker,
              '✅ CI completed successfully.',
              '',
              `[Workflow run](${run.html_url})`,
              ...(artifactLines.length > 0 ? ['', 'Artifacts:', ...artifactLines] : []),
            ].join('\n');

            for (const pullRequest of pullRequests) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pullRequest.number, per_page: 100 }
              );
              const previous = comments.find(
                comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
              );

              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pullRequest.number, body });
              }
            }
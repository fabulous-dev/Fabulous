site_name: Fabulous Documentation
site_description: Build cross-platform applications in F# with Fabulous.
site_url: https://fabulous-dev.github.io/Fabulous/docs/
repo_url: https://github.com/fabulous-dev/Fabulous
edit_uri: edit/main/docs/

docs_dir: .
theme:
  name: readthedocs

nav:
  - Welcome: README.md
  - Choose a backend: get-started.md
  - Glossary: glossary.md
  - Tutorials:
    - .NET MAUI: tutorials/maui.md
    - Avalonia: tutorials/avalonia.md
  - Platforms:
      - .NET MAUI: maui/get-started.md
      - Route-based navigation: maui/navigation.md
      - Avalonia: avalonia/get-started.md
      - Migrate to Avalonia 12: avalonia/migrate-to-12.md
  - Core concepts:
    - Programs and commands: concepts/programs.md
    - UI and interaction: concepts/ui.md
  - Guides:
    - Testing and debugging: guides/testing-debugging.md
    - Performance and collections: guides/performance.md
    - Deployment: guides/deployment.md
    - Migrate to 10.0.x: guides/migration.md
  - Architecture: architecture/README.md
  - API reference: https://fabulous-dev.github.io/Fabulous/docs/api/

exclude_docs: |
  SUMMARY.md
  api/**
  api/README.md
  api/source-inventory.md
  advanced/**
  architecture/attribute-definitions.md
  architecture/using-nightly-builds.md
  architecture/virtualized-collections.md
  basics/**
  samples-and-tutorials/**

markdown_extensions:
  - admonition
  - fenced_code
  - tables